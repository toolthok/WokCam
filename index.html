<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>WokCam</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><meta name="theme-color" content="#16181d">
<style>
:root{--bg:#16181d;--card:#1f232b;--line:#343a46;--tx:#eceae4;--mu:#9aa0ac;--gold:#f2b01e;--chili:#ff7a5c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif;padding:env(safe-area-inset-top) 16px calc(40px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto}h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:22px 0 2px}h1 i{font-style:normal;color:var(--gold)}
.sub{color:var(--mu);margin:0 0 16px}
textarea{width:100%;min-height:150px;background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;resize:vertical}
textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
button{font:inherit;color:var(--tx);background:none;border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer}
button.go{background:var(--gold);color:#16181d;border-color:var(--gold);font-weight:700}
#sum{color:var(--mu);margin:14px 0 8px;min-height:24px}
.card{background:var(--card);border-left:4px solid var(--gold);border-radius:4px 14px 14px 4px;padding:12px 14px;margin-bottom:10px}
.meta{display:flex;justify-content:space-between;color:var(--mu);font-size:13px}
.card p{margin:6px 0 10px}mark{background:none;color:var(--gold);font-weight:700;text-decoration:underline dotted}
.chip{border-color:var(--gold);padding:6px 12px;border-radius:99px}.chip.cek{border:1px dashed var(--chili);color:var(--chili)}
.card small{color:var(--mu);margin-left:8px}
dialog{width:min(460px,94vw);background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:16px;padding:14px;max-height:80vh}
dialog::backdrop{background:#000a}#opts button{display:flex;gap:10px;width:100%;text-align:left;margin-bottom:6px;align-items:center}
#opts button.on{border-color:var(--gold)}#opts small{display:block;color:var(--mu)}
h2{font-size:20px;margin:28px 0 6px}.f{display:block;margin:10px 0;color:var(--mu)}.f input{display:block;width:100%;margin-top:4px;color:var(--tx)}
canvas{display:block;margin:12px auto;width:min(100%,calc(70vh*9/16));aspect-ratio:9/16;background:#000;border-radius:12px}
#st{color:var(--mu);min-height:24px}#dl{display:inline-block;margin-top:8px;color:var(--gold);font-weight:700}button:disabled{opacity:.4}
</style></head><body><main>
<h1>Wok<i>Cam</i></h1><p class="sub">Tempel naskah. Gaya editing dipilihkan per kalimat.</p>
<textarea id="src" placeholder="Tulis atau tempel naskah voice-over di sini…"></textarea>
<div class="bar"><button class="go" id="go">Pecah jadi segmen</button><button id="sample">Contoh naskah</button></div>
<div id="sum"></div><div id="list"></div>
<div class="bar"><button id="all">Terima semua saran</button><button id="copy">Salin rencana</button></div>
<section id="studio" hidden><h2>Bahan video</h2>
<label class="f">Footage (video)<input type="file" id="vid" accept="video/*"></label>
<label class="f">Voice-over (audio, opsional)<input type="file" id="aud" accept="audio/*"></label>
<canvas id="cv" width="540" height="960"></canvas>
<div class="bar"><button class="go" id="play">Pratinjau</button><button id="rec">Ekspor video</button></div>
<div id="st"></div><a id="dl" hidden></a></section>
<dialog id="dlg"><div id="opts"></div><button id="x">Tutup</button></dialog>
</main><script>
const $=s=>document.querySelector(s),esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let T={},W={},PO=[],P,segs=[],cur=-1;
const SAMPLE="Ternyata bikin video itu nggak harus ribet. Dulu gue butuh 3 jam buat satu video 30 detik. Sekarang cukup 10 menit, hemat 90 persen waktu. Langkah pertama, tulis naskahnya dulu. Selanjutnya biarkan app yang milih gaya editingnya. Follow buat tips bikin konten lebih cepat.";
async function init(){
 const [t,p]=await Promise.all(['data/teknik.json','data/pemicu.json'].map(u=>fetch(u).then(r=>r.json())));
 t.forEach(x=>T[x.id]=x);P=p;
 for(const [lv,c] of [['cek',.7],['auto',.9]])for(const id in p[lv])p[lv][id].forEach(w=>W[w]=[id,c]);
 window.WK=W;PO=p.pola.map(([r,id])=>[new RegExp(r,'iu'),id]);
 try{$('#src').value=localStorage.getItem('wokcam.naskah')||''}catch(e){}
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
function analyze(txt){
 const parts=txt.split(/(?<=[.!?…])\s+|\n+/).map(s=>s.trim()).filter(Boolean);
 return parts.map((s,i)=>{
  const words=s.toLowerCase().match(/[\p{L}\p{N}]+/gu)||[];let best=null;
  const hit=(t,c,w)=>{if(!best||c>best.c)best={t,c,w}};
  words.forEach(w=>W[w]&&hit(W[w][0],W[w][1],w));
  PO.forEach(([r,id])=>r.test(s)&&hit(id,.95,'angka'));
  if(parts.length>1&&i==0)best={t:P.awal,c:.9,w:'kalimat pembuka'};
  else if(parts.length>1&&i==parts.length-1)best={t:P.akhir,c:.9,w:'kalimat penutup'};
  if(!best)best={t:'b-roll',c:.5,w:'tidak ada pemicu'};
  return{s,t:best.t,why:best.w,ok:best.c>=.85,d:Math.max(1.2,words.length/2.7)};
 });
}
function render(){
 $('#list').innerHTML=segs.map((g,i)=>{
  const t=T[g.t],html=g.s.split(/([\p{L}\p{N}%]+)/u).map((p,k)=>k%2&&W[p.toLowerCase()]?`<mark>${esc(p)}</mark>`:esc(p)).join('');
  return `<article class="card"><div class="meta"><b>${i+1}</b><span>${g.d.toFixed(1)} dtk</span></div><p>${html}</p><button class="chip${g.ok?'':' cek'}" data-i="${i}">${t.ikon} ${t.nama}${g.ok?'':' ?'}</button><small>pemicu: ${esc(g.why)}</small></article>`}).join('');
 const tot=segs.reduce((a,g)=>a+g.d,0),cek=segs.filter(g=>!g.ok).length;
 $('#sum').textContent=segs.length?`${segs.length} segmen · ±${Math.round(tot)} dtk · ${cek} perlu dicek`:'';
}
$('#go').onclick=()=>{const v=$('#src').value;try{localStorage.setItem('wokcam.naskah',v)}catch(e){}segs=analyze(v);render()};
$('#sample').onclick=()=>{$('#src').value=SAMPLE};
$('#all').onclick=()=>{segs.forEach(g=>g.ok=true);render()};
$('#copy').onclick=async()=>{const j=JSON.stringify(segs.map((g,i)=>({no:i+1,teks:g.s,teknik:g.t,dtk:+g.d.toFixed(1),pasti:g.ok})),null,1);try{await navigator.clipboard.writeText(j);$('#copy').textContent='Tersalin'}catch(e){prompt('Salin rencana:',j)}setTimeout(()=>$('#copy').textContent='Salin rencana',1500)};
$('#list').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;cur=+b.dataset.i;$('#opts').innerHTML=Object.values(T).map(t=>`<button data-id="${t.id}" class="${t.id===segs[cur].t?'on':''}"><span>${t.ikon}</span><div><b>${t.nama}</b><small>${t.desc}</small></div></button>`).join('');$('#dlg').showModal()};
$('#opts').onclick=e=>{const b=e.target.closest('button');if(!b)return;Object.assign(segs[cur],{t:b.dataset.id,ok:true});$('#dlg').close();render()};
$('#x').onclick=()=>$('#dlg').close();

const _r=render;render=function(){_r();const c=segs.filter(g=>!g.ok).length,b=$('#all');b.disabled=!segs.length||!c;b.textContent=c?'Terima '+c+' saran':'Semua sudah pasti';$('#studio').hidden=!segs.length};
let V=document.createElement('video'),A=null,vurl,aurl,busy=false;V.muted=true;V.loop=true;V.playsInline=true;
const cv=$('#cv'),cx=cv.getContext('2d'),CW=cv.width,CH=cv.height,FN='"Avenir Next","Segoe UI",sans-serif';
$('#vid').onchange=e=>{const f=e.target.files[0];if(f){vurl&&URL.revokeObjectURL(vurl);V.src=vurl=URL.createObjectURL(f);V.load()}};
$('#aud').onchange=e=>{const f=e.target.files[0];aurl&&URL.revokeObjectURL(aurl);aurl=f?URL.createObjectURL(f):null};
function plan(){const w=segs.map(g=>g.s.split(/\s+/).length+1.5),tw=w.reduce((a,b)=>a+b,0),total=(A&&isFinite(A.duration))?A.duration:segs.reduce((a,g)=>a+g.d,0);let t=0;return{total,tl:segs.map((g,i)=>{const d=total*w[i]/tw,o={g,t0:t,d};t+=d;return o})}}
function kw(g){const ws=g.s.toLowerCase().match(/[\p{L}\p{N}]+/gu)||[];return ws.find(w=>W_[w])||ws.sort((a,b)=>b.length-a.length)[0]||''}
const W_=new Proxy({},{get:(_,k)=>window.WK&&window.WK[k]});
function big(t,u,col){t=t.toUpperCase();const k=Math.min(1,.6+u/.25*.4),fs=Math.min(150,Math.floor(470/(t.length*.62)));cx.save();cx.translate(CW/2,CH*.4);cx.scale(k,k);cx.font='900 '+fs+'px '+FN;cx.textAlign='center';cx.textBaseline='middle';cx.lineWidth=14;cx.lineJoin='round';cx.strokeStyle='#000';cx.strokeText(t,0,0);cx.fillStyle=col;cx.fillText(t,0,0);cx.restore()}
function cap(s,p,rev){cx.font='800 46px '+FN;cx.textAlign='left';cx.textBaseline='middle';cx.lineJoin='round';const ws=s.split(/\s+/),sp=cx.measureText(' ').width,L=[[]];let x=0;
 ws.forEach((w,i)=>{const m=cx.measureText(w).width;if(x+m>CW-90&&L[L.length-1].length){L.push([]);x=0}L[L.length-1].push({w,m,i});x+=m+sp});
 const c=Math.min(ws.length-1,Math.floor(p*ws.length)),y0=CH*.68;
 L.forEach((l,r)=>{let x=(CW-l.reduce((a,o)=>a+o.m+sp,-sp))/2;l.forEach(o=>{if(!(rev&&o.i>c)){cx.lineWidth=9;cx.strokeStyle='#000';cx.strokeText(o.w,x,y0+r*58);cx.fillStyle=o.i===c?'#f2b01e':'#fff';cx.fillText(o.w,x,y0+r*58)}x+=o.m+sp})})}
function frame(tl,t){
 const s=tl.find(x=>t>=x.t0&&t<x.t0+x.d)||tl[tl.length-1],u=t-s.t0,p=Math.min(1,u/s.d),id=s.g.t;let z=1,dx=0,dy=0;
 if(id==='punch-zoom'||id==='hook')z=1+.15*Math.max(0,1-u/.35);
 if(id==='shake'&&u<.5){dx=(Math.random()-.5)*24;dy=(Math.random()-.5)*24}
 if(id==='whoosh'&&u<.25)dx=CW*.3*(1-u/.25);
 V.playbackRate=id==='slowmo'?.5:(id==='speed-ramp'&&u<s.d/2?2:1);
 if(id==='freeze'&&u<.7){if(!V.paused)V.pause()}else if(V.paused)V.play().catch(()=>{});
 cx.save();cx.fillStyle='#000';cx.fillRect(0,0,CW,CH);cx.translate(CW/2+dx,CH/2+dy);cx.scale(z,z);
 const vw=V.videoWidth||CW,vh=V.videoHeight||CH,k=Math.max(CW/vw,CH/vh);if(V.readyState>1)cx.drawImage(V,-vw*k/2,-vh*k/2,vw*k,vh*k);cx.restore();
 if(id==='glitch'&&u<.3)for(let i=0;i<6;i++){const y=Math.random()*CH,h=30+Math.random()*60;cx.drawImage(cv,0,y,CW,h,(Math.random()-.5)*50,y,CW,h)}
 if(id==='flash'&&u<.2){cx.fillStyle='rgba(255,255,255,'+(1-u/.2)+')';cx.fillRect(0,0,CW,CH)}
 if(id==='big-number'){const m=s.g.s.match(/\d+(?:[.,]\d+)?\s*(?:%|persen|percent|kali lipat)?/i);big(m?m[0].replace(/\s*(persen|percent)/i,'%'):kw(s.g),u,'#f2b01e')}
 if(id==='text-pop')big(kw(s.g),u,'#fff');
 cap(s.g.s,p,id==='kinetic');
 if(id==='cta'){cx.fillStyle='#f2b01e';cx.beginPath();cx.roundRect(CW/2-110,CH*.84,220,64,32);cx.fill();cx.fillStyle='#16181d';cx.font='800 30px '+FN;cx.textAlign='center';cx.fillText('Follow',CW/2,CH*.84+33)}
}
const btn=b=>{$('#play').disabled=$('#rec').disabled=b};
async function run(recording){
 if(busy||!segs.length)return;if(!V.src){$('#st').textContent='Pilih footage dulu.';return}
 busy=true;btn(true);$('#dl').hidden=true;A=null;
 if(aurl){A=new Audio(aurl);await new Promise(r=>{A.onloadedmetadata=r;A.onerror=r})}
 const{total,tl}=plan();let rec,mt='',ch=[],ac;V.currentTime=0;await V.play().catch(()=>{});
 if(recording){const st=cv.captureStream(30);
  if(A){ac=new AudioContext();const sr=ac.createMediaElementSource(A),ds=ac.createMediaStreamDestination();sr.connect(ds);ds.stream.getAudioTracks().forEach(t=>st.addTrack(t))}
  mt=['video/mp4','video/webm;codecs=vp9,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m))||'';
  rec=new MediaRecorder(st,mt?{mimeType:mt}:{});rec.ondataavailable=e=>e.data.size&&ch.push(e.data);rec.start()}
 if(A)await A.play().catch(()=>{});
 const t0=performance.now();
 await new Promise(done=>{(function loop(){const t=(performance.now()-t0)/1000;if(t>=total)return done();frame(tl,t);$('#st').textContent=(recording?'Merekam ':'Memutar ')+t.toFixed(1)+' / '+total.toFixed(1)+' dtk';requestAnimationFrame(loop)})()});
 A&&A.pause();V.pause();
 if(rec){await new Promise(r=>{rec.onstop=r;rec.stop()});const ext=mt.includes('mp4')?'mp4':'webm',b=new Blob(ch,{type:mt||'video/webm'}),a=$('#dl');a.href=URL.createObjectURL(b);a.download='wokcam.'+ext;a.hidden=false;a.textContent='Unduh video ('+ext+', '+(b.size/1e6).toFixed(1)+' MB)'}
 ac&&ac.close();$('#st').textContent='Selesai.';busy=false;btn(false)}
$('#play').onclick=()=>run(false);$('#rec').onclick=()=>run(true);
init();
</script></body></html>
