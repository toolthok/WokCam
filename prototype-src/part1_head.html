<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prototipe — App Editing Tanpa Timeline (2 Metode)</title>
<style>
  :root{
    --bg:#0b1220; --bg2:#0e1830; --panel:rgba(255,255,255,.055); --panel-b:rgba(255,255,255,.11);
    --tx:#e8eef6; --tx2:#93a3b8; --cy:#37DCF2; --teal:#14b8a6; --teal-d:#0f766e;
    --amber:#fbbf24; --red:#f87171; --card:#101a2e;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 800px at 70% -10%, #14264a 0%, var(--bg) 55%) fixed;
    color:var(--tx); font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; gap:44px; padding:28px; flex-wrap:wrap;
  }
  /* ── Panel kiri (panduan) ── */
  .side{width:390px; max-width:94vw}
  .side h1{font-size:26px; line-height:1.25; letter-spacing:.2px}
  .side h1 em{color:var(--cy); font-style:normal}
  .side p.lead{color:var(--tx2); font-size:14.5px; line-height:1.65; margin:12px 0 18px}
  .steps{display:flex; flex-direction:column; gap:10px; margin-bottom:18px}
  .step{display:flex; gap:12px; background:var(--panel); border:1px solid var(--panel-b); border-radius:14px; padding:12px 14px; transition:.3s}
  .step.on{border-color:rgba(55,220,242,.55); background:rgba(55,220,242,.08); box-shadow:0 0 0 1px rgba(55,220,242,.25)}
  .step b{font-size:14px}
  .step small{display:block; color:var(--tx2); font-size:12.5px; line-height:1.5; margin-top:2px}
  .step .n{flex:0 0 26px; height:26px; border-radius:50%; background:var(--panel-b); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:var(--cy)}
  .legend{font-size:12px; color:var(--tx2); line-height:1.7; background:var(--panel); border:1px solid var(--panel-b); border-radius:12px; padding:10px 14px}
  .legend code{color:var(--cy); font-family:Consolas,monospace}
  /* ── Ponsel ── */
  .phone-wrap{display:flex; flex-direction:column; align-items:center; gap:14px}
  .phone{
    width:392px; height:820px; max-height:92vh; border-radius:46px; background:#000;
    border:11px solid #1b2331; box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 0 0 2px #000;
    position:relative; overflow:hidden;
  }
  .notch{position:absolute; top:0; left:50%; transform:translateX(-50%); width:150px; height:26px; background:#1b2331; border-radius:0 0 16px 16px; z-index:60}
  .screen{position:absolute; inset:0; display:flex; flex-direction:column; background:linear-gradient(180deg,#0d1526,#0a1120); opacity:0; transform:translateX(24px); pointer-events:none; transition:opacity .35s, transform .35s; z-index:5}
  .screen.active{opacity:1; transform:none; pointer-events:auto}
  .sbar{height:34px; display:flex; align-items:center; justify-content:space-between; padding:0 22px; font-size:11.5px; color:var(--tx2); flex:0 0 auto}
  .appbar{height:52px; display:flex; align-items:center; gap:10px; padding:0 16px; flex:0 0 auto}
  .appbar .t{font-weight:700; font-size:16.5px}
  .appbar .s{font-size:11px; color:var(--cy); letter-spacing:1.5px; text-transform:uppercase}
  .iconbtn{width:34px; height:34px; border-radius:11px; border:1px solid var(--panel-b); background:var(--panel); color:var(--tx); font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center}
  .iconbtn:active{transform:scale(.93)}
  .stage-badge{margin-left:auto; font-size:11px; padding:5px 10px; border-radius:999px; background:rgba(55,220,242,.12); color:var(--cy); border:1px solid rgba(55,220,242,.35); font-weight:600}
  .content{flex:1; overflow-y:auto; padding:6px 16px 16px; scrollbar-width:none}
  .content::-webkit-scrollbar{display:none}
  .btn{border:none; cursor:pointer; border-radius:14px; padding:13px 18px; font-size:14.5px; font-weight:700; color:#04252b; background:linear-gradient(135deg,var(--cy),var(--teal)); width:100%; transition:.2s}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:var(--panel); color:var(--tx); border:1px solid var(--panel-b)}
  .btn.small{padding:9px 12px; font-size:12.5px; width:auto; border-radius:11px}
  .btn.row2{display:flex; gap:10px; width:100%}
  .btn[disabled]{opacity:.4; pointer-events:none}
  .card{background:var(--card); border:1px solid var(--panel-b); border-radius:18px; padding:14px; margin-bottom:12px}
  .card h3{font-size:14.5px; margin-bottom:6px}
  .card p{font-size:12.5px; color:var(--tx2); line-height:1.6}
  .kv{display:flex; justify-content:space-between; font-size:12.5px; padding:7px 0; border-bottom:1px dashed rgba(255,255,255,.07)}
  .kv:last-child{border-bottom:none}
  .kv span{color:var(--tx2)} .kv b{font-weight:600}
  .chip{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; padding:7px 11px; border-radius:999px; border:1px solid var(--panel-b); background:var(--panel); margin:0 6px 6px 0; cursor:pointer; user-select:none; transition:.2s; color:var(--tx)}
  .chip code{font-family:Consolas,monospace; color:var(--cy); font-size:10.5px}
  .chip.acc{border-color:rgba(20,184,166,.6); background:rgba(20,184,166,.12)}
  .chip.acc::after{content:"✓"; color:var(--teal); font-weight:800}
  .chip.rej{opacity:.42; text-decoration:line-through}
  .chip.unknown{border-color:rgba(251,191,36,.5)} .chip.unknown code{color:var(--amber)}
  /* analisis */
  .scan{position:relative; height:180px; border-radius:16px; overflow:hidden; border:1px solid var(--panel-b); background:#0a1424; margin-bottom:12px}
  .scan .line{position:absolute; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent,var(--cy),transparent); animation:scanline 1.6s linear infinite}
  @keyframes scanline{0%{top:0}100%{top:100%}}
  .scan .lbl{position:absolute; bottom:10px; left:12px; font-size:11px; color:var(--cy); letter-spacing:1px}
  .log{font-size:11.5px; color:var(--tx2); line-height:1.9; min-height:118px}
  .log b{color:var(--teal)}
  .dotflow{display:flex; align-items:center; gap:6px; margin:8px 0 4px}
  .dotflow i{width:8px; height:8px; border-radius:50%; background:var(--panel-b)}
  .dotflow i.on{background:var(--cy); box-shadow:0 0 8px var(--cy)}
  .dotflow u{flex:1; height:1px; background:var(--panel-b); text-decoration:none}
  /* kartu anchor */
  .acard{border-left:3px solid var(--cy)}
  .acard .head{display:flex; align-items:center; gap:8px; margin-bottom:6px}
  .acard .tcode{font-family:Consolas,monospace; font-size:11px; color:var(--cy); background:rgba(55,220,242,.1); border:1px solid rgba(55,220,242,.3); padding:2px 7px; border-radius:7px}
  .acard .tname{font-weight:700; font-size:13.5px}
  .acard .tm{margin-left:auto; font-size:11.5px; color:var(--tx2); font-family:Consolas,monospace}
  .acard .trig{font-size:11.5px; color:var(--amber); margin:4px 0 8px}
  .acard .acts{display:flex; gap:8px}
  .acard .acts .btn{padding:8px 10px; font-size:12px; border-radius:10px}
  .acard.done-acc{border-left-color:var(--teal); opacity:.6}
  .acard.done-rej{border-left-color:var(--red); opacity:.45; filter:grayscale(.6)}
  .prevbox{height:240px; border-radius:12px; background:#0a1424; border:1px solid var(--panel-b); margin:8px 0; position:relative; overflow:hidden}
  .prevbox canvas{width:100%; height:100%; display:block}
  /* studio */
  .vidwrap{position:relative; flex:0 0 auto; height:430px; background:#000; overflow:hidden; cursor:pointer}
  #vid{width:100%; height:100%; display:block}
  .vidhint{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; opacity:0; transition:.25s}
  .vidhint.show{opacity:1}
  .vidhint span{background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.18); padding:8px 14px; border-radius:999px; font-size:12px; backdrop-filter:blur(6px)}
  .ctl{flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:8px 14px; background:rgba(255,255,255,.03); border-top:1px solid rgba(255,255,255,.06)}
  .play{width:36px; height:36px; border-radius:50%; border:none; background:var(--cy); color:#04252b; font-size:14px; font-weight:800; cursor:pointer; flex:0 0 auto}
  .track{flex:1; position:relative; height:26px; display:flex; align-items:center; cursor:pointer}
  .track .rail{width:100%; height:4px; border-radius:2px; background:rgba(255,255,255,.14); position:relative}
  .track .fill{position:absolute; left:0; top:0; bottom:0; border-radius:2px; background:linear-gradient(90deg,var(--teal),var(--cy)); width:0}
  .marker{position:absolute; top:50%; width:10px; height:10px; border-radius:50%; background:var(--cy); border:2px solid #06222b; transform:translate(-50%,-50%); cursor:pointer; z-index:2}
  .tcur{font-family:Consolas,monospace; font-size:11px; color:var(--tx2); flex:0 0 64px; text-align:right}
  /* sutradara */
  .sutra{flex:1; min-height:0; padding:10px 14px 14px; display:flex; flex-direction:column; gap:8px}
  .sutra-head{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--tx2)}
  .sutra-head b{color:var(--tx)}
  .scard{background:linear-gradient(135deg,rgba(55,220,242,.12),rgba(20,184,166,.07)); border:1px solid rgba(55,220,242,.4); border-radius:16px; padding:12px 14px; transform:translateY(8px); opacity:0; transition:.35s}
  .scard.show{transform:none; opacity:1}
  .scard .who{font-size:10.5px; letter-spacing:1.2px; color:var(--cy); text-transform:uppercase; font-weight:700}
  .scard .msg{font-size:13.5px; line-height:1.55; margin:5px 0 10px}
  .scard .msg code{font-family:Consolas,monospace; font-size:11px; color:var(--cy)}
  .scard .acts{display:flex; gap:8px}
  .scard .acts .btn{flex:1; padding:9px 8px; font-size:12.5px; border-radius:11px}
  .applied{flex:1; overflow-y:auto; scrollbar-width:none}
  .applied::-webkit-scrollbar{display:none}
  .applied .it{display:flex; align-items:center; gap:8px; font-size:12px; padding:7px 2px; border-bottom:1px dashed rgba(255,255,255,.07)}
  .applied .it .tm{margin-left:auto; font-family:Consolas,monospace; color:var(--tx2); font-size:11px}
  .applied .it code{font-family:Consolas,monospace; color:var(--cy); font-size:10.5px}
  .applied .it .undo{margin-left:6px; color:var(--red); cursor:pointer; font-size:11px; border:none; background:none}
  .empty{font-size:12px; color:var(--tx2); text-align:center; padding:18px 0}
  /* radial menu */
  .radial-layer{position:absolute; inset:0; z-index:40; display:none}
  .radial-layer.show{display:block}
  .radial-layer .veil{position:absolute; inset:0; background:rgba(4,10,18,.55); backdrop-filter:blur(2px)}
  .ritem{position:absolute; width:64px; height:64px; margin:-32px 0 0 -32px; border-radius:50%; border:1.5px solid rgba(55,220,242,.55); background:rgba(10,25,40,.88); color:var(--tx); font-size:9.5px; font-weight:700; line-height:1.15; text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; cursor:pointer; transform:scale(.4); opacity:0; transition:transform .28s cubic-bezier(.2,1.6,.4,1), opacity .2s; box-shadow:0 4px 18px rgba(0,0,0,.4); padding:4px}
  .ritem .c{font-family:Consolas,monospace; font-size:8px; color:var(--cy)}
  .ritem.center{width:58px; height:58px; margin:-29px 0 0 -29px; border-color:rgba(255,255,255,.4); font-size:10px}
  .ritem.show{transform:scale(1); opacity:1}
  .ritem:active{transform:scale(.9)!important; background:rgba(55,220,242,.25)}
  .rlbl{position:absolute; font-size:10.5px; color:var(--tx2); background:rgba(4,10,18,.7); padding:3px 9px; border-radius:999px; transform:scale(.4); opacity:0; transition:.2s}
  .rlbl.show{transform:scale(1); opacity:1}
  /* toast */
  .toast{position:absolute; left:50%; bottom:96px; transform:translateX(-50%) translateY(14px); background:rgba(8,20,32,.92); border:1px solid rgba(55,220,242,.5); color:var(--tx); font-size:12px; padding:9px 15px; border-radius:999px; opacity:0; transition:.3s; z-index:50; pointer-events:none; white-space:nowrap; backdrop-filter:blur(8px)}
  .toast.show{opacity:1; transform:translateX(-50%)}
  .toast code{color:var(--cy); font-family:Consolas,monospace; font-size:11px}
  /* ekspor */
  .exp{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center}
  .exp .ring{width:130px; height:130px; border-radius:50%; border:5px solid rgba(255,255,255,.08); border-top-color:var(--cy); animation:spin 1s linear infinite; margin-bottom:26px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .exp .pct{font-size:34px; font-weight:800}
  .exp .st{color:var(--tx2); font-size:13px; margin-top:6px}
  .exp h2{font-size:21px; margin-bottom:8px}
  .exp .big{font-size:15px; color:var(--tx2); line-height:1.7}
  .exp .big b{color:var(--cy)}
  .check{width:88px; height:88px; border-radius:50%; background:rgba(20,184,166,.15); border:2px solid var(--teal); color:var(--teal); font-size:42px; display:flex; align-items:center; justify-content:center; margin-bottom:22px}
  .footer-note{position:absolute; bottom:8px; left:0; right:0; text-align:center; font-size:10px; color:#3c4a5e; z-index:6}
  .hint-key{display:inline-block; background:var(--panel); border:1px solid var(--panel-b); border-radius:6px; padding:1px 6px; font-size:11px}
  /* ── pemilih metode ── */
  .modecard{display:flex; gap:14px; align-items:flex-start; width:100%; text-align:left; background:var(--card); border:1px solid var(--panel-b); border-radius:18px; padding:16px; margin-bottom:12px; cursor:pointer; color:var(--tx); transition:.2s; font-family:inherit}
  .modecard:active{transform:scale(.98)}
  .modecard .mi{font-size:22px; flex:0 0 44px; height:44px; border-radius:13px; background:rgba(55,220,242,.1); border:1px solid rgba(55,220,242,.3); display:flex; align-items:center; justify-content:center}
  .modecard.alt .mi{background:rgba(20,184,166,.1); border-color:rgba(20,184,166,.35)}
  .modecard b{font-size:15px}
  .modecard small{display:block; color:var(--tx2); font-size:12px; line-height:1.55; margin-top:4px}
  .modecard .arr{margin-left:auto; color:var(--cy); font-size:18px; align-self:center}
  /* ── rekam VO ── */
  .vo-center{text-align:center; padding:8px 0 2px}
  .micbtn{width:86px; height:86px; border-radius:50%; border:2px solid rgba(55,220,242,.5); background:rgba(55,220,242,.08); font-size:34px; cursor:pointer; transition:.25s}
  .micbtn.rec{background:rgba(248,113,113,.16); border-color:var(--red); animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.4)}50%{box-shadow:0 0 0 16px rgba(248,113,113,0)}}
  #miclbl{font-size:12.5px; color:var(--tx2); margin-top:8px}
  .rectime{font-family:Consolas,monospace; color:var(--red); font-size:12px; margin-top:4px}
  .interim{font-size:12px; color:var(--tx2); font-style:italic; min-height:16px; margin-top:6px}
  .livetext{font-size:13px; line-height:1.6; color:var(--tx); max-height:110px; overflow-y:auto; text-align:left; background:rgba(255,255,255,.03); border:1px solid var(--panel-b); border-radius:12px; padding:10px 12px; margin-top:8px}
  .livetext:empty{display:none}
  textarea{width:100%; min-height:118px; background:rgba(255,255,255,.04); border:1px solid var(--panel-b); border-radius:12px; color:var(--tx); font-family:inherit; font-size:12.5px; padding:10px; resize:vertical; line-height:1.55}
  textarea:focus{outline:1px solid rgba(55,220,242,.4)}
  .row{display:flex; gap:10px; margin-top:10px}
  .row .btn{flex:1}
  /* ── tinjau pemicu ── */
  .sech{font-size:13px; margin:4px 2px 10px}
  .confhi{font-size:10px; color:var(--teal); border:1px solid rgba(20,184,166,.4); padding:2px 8px; border-radius:999px; margin-left:6px; vertical-align:2px}
  #m2-auto .it{display:flex; align-items:center; gap:8px; font-size:12px; padding:7px 2px; border-bottom:1px dashed rgba(255,255,255,.07)}
  #m2-auto .it:last-child{border-bottom:none}
  #m2-auto .it code{font-family:Consolas,monospace; color:var(--teal); font-size:10.5px}
  #m2-auto .it .tm{margin-left:auto; font-family:Consolas,monospace; color:var(--tx2); font-size:11px; text-align:right}
</style>
</head>
<body>
